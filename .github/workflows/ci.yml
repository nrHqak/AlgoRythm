name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint and tests
    runs-on: ubuntu-latest
    env:
      PYTHON_DOTENV_DISABLED: "1"
      REWARD_DATABASE_REQUIRED: "1"
      REWARD_POSTGRES_BIN: /usr/lib/postgresql/16/bin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14.7"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m ruff check backend frontend/src/runtime scripts tests
      - name: Ensure disposable PostgreSQL test binaries
        run: |
          if [ ! -x /usr/lib/postgresql/16/bin/initdb ]; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-16
          fi
      - run: python -m pytest --cov=backend --cov-report=term-missing

  frontend:
    name: Frontend lint, tests, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run test:coverage
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  context:
    name: Context integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14.7"
      - name: Test context tooling and links
        run: python -m unittest discover -s tests -p 'test_context_*.py'
      - name: Warn when generated context is stale
        continue-on-error: true
        run: |
          if ! python scripts/context_map.py --strict; then
            echo "::warning file=docs/context/REPOSITORY_MAP.md::Generated context is stale. Run make context and commit the result."
            exit 1
          fi
